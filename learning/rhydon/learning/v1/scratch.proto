// Scratch file for practicing protobuf syntax. Excluded from the buf module
// (see buf.yaml `excludes: [learning]`) — nothing in here is linted, checked
// for breaking changes, or code-generated by CI. Break things on purpose.
//
// Work through the exercises top to bottom. Each one builds on the last.
// Real conventions to match are in ../CONTRIBUTING.md and ../rhydon/*/v1/*.proto
// — peek at those once you've had a real attempt, not before.

syntax = "proto3";

package rhydon.learning.v1;

option go_package = "github.com/rhydonhq/proto/gen/go/rhydon/learning/v1;learningv1";

// --- Exercise 1 ---
// Define a message `Ping` with one string field `message` and one int64
// field `sent_at_unix_ms`. Number the fields yourself — what happens if you
// start at 0 instead of 1? (Try it, read the error, then fix it.)

message Ping {
    string message = 1;
    int64 sent_at_unix_ms = 2;
}

// --- Exercise 2 ---
// Define an enum `Priority` for a hypothetical support-ticket system, with
// values LOW, NORMAL, HIGH. Remember the project convention: every enum's
// zero value is `*_UNSPECIFIED`. Write down in one sentence *why* proto3
// forces this (hint: it's about the difference between "unset" and "the
// first real option") — you'll want this answer sharp for interviews.

// Fixed: was missing the zero-value UNSPECIFIED member (see the answer
// written above the exercise) — LOW started at 1 with no way to represent
// "not set" distinctly from an explicit choice.
enum Priority {
    PRIORITY_UNSPECIFIED = 0;
    PRIORITY_LOW = 1;
    PRIORITY_NORMAL = 2;
    PRIORITY_HIGH = 3;
}

// --- Exercise 3 ---
// Import the real common types and use them:
//   import "rhydon/common/v1/types.proto";
// Define a message `Waypoint` with a `rhydon.common.v1.Coordinate position`
// field and a `string label` field. This is the same pattern trip.proto and
// dispatch.proto use for pickup/dropoff — go look at how they reference
// `rhydon.common.v1.Coordinate` after you've tried it yourself.
import "rhydon/common/v1/types.proto";

// The import brings in the WHOLE file's package (rhydon.common.v1), not
// just one message — so every message that file declares (Coordinate,
// Money, PageRequest, PageResponse) becomes available, fully qualified.
message Waypoint {
    rhydon.common.v1.Coordinate position = 1;
    string label = 2;
}

// --- Exercise 4 ---
// Define a service `PingService` with one unary RPC `Ping(PingRequest)
// returns (PingResponse)`. You'll need to define PingRequest/PingResponse
// too (or reuse the `Ping` message from Exercise 1 — decide if that's a good
// idea and note why in INTERVIEW_NOTES.md if it isn't obvious).

// Deliberately NOT reusing `Ping` as both request and response: trip.proto
// does something similar with TripResponse across five RPCs, and buf lint
// itself flags "used as request/response for multiple RPCs" as a smell
// (you'd have seen this if you ran `buf lint` against the real repo root —
// it fires on trip.proto right now). The reason it matters: PingRequest and
// PingResponse will inevitably diverge — a response might later need a
// server_time field, a request might later need a client_id — and once two
// RPCs share one message type, adding a field for one RPC's sake pollutes
// every other RPC using that same message. Dedicated types per RPC cost a
// few extra lines and buy you the freedom to evolve each independently.
message PingRequest {
    string message = 1;
}

message PingResponse {
    string echoed_message = 1;
    int64 server_time_unix_ms = 2;
}

service PingService {
    rpc Ping(PingRequest) returns (PingResponse);
}

// --- Exercise 5 (harder) ---
// Define a server-streaming RPC `WatchPings(WatchPingsRequest) returns
// (stream Ping)`. Then, separately, sketch (in a comment, no need to make it
// compile) what a *client*-streaming version would look like instead, and
// when you'd pick one over the other. location.proto's StreamLocation RPC
// is the real example — compare your sketch against it once you've tried.

message WatchPingsRequest {
    string subscriber_id = 1;
}

service PingWatchService {
    // Server-streaming: ONE request opens a long-lived connection, and the
    // SERVER pushes many responses over time. Right shape whenever a client
    // wants to keep listening for events it doesn't control the timing of —
    // trip.proto's WatchTrip is the same pattern (a rider watching for
    // status changes it can't predict).
    rpc WatchPings(WatchPingsRequest) returns (stream Ping);
}

// Sketch only (not meant to compile) — a CLIENT-streaming version would
// invert who's doing the pushing:
//
//   service PingWatchService {
//     rpc SendPings(stream Ping) returns (WatchPingsSummary);
//   }
//
// Here the CLIENT opens the connection and pushes many messages over time;
// the server just accumulates them and returns one final response when the
// client closes the stream. Right shape when the CLIENT is the one
// generating a steady flow of updates and doesn't need a response per
// message — location.proto's real StreamLocation RPC is exactly this: a
// driver's phone pushes a GPS fix every few seconds, and paying the cost of
// a full request/response round trip per fix would be pure overhead for a
// ~16-byte payload. The dividing line: whichever side naturally produces a
// SEQUENCE of things over time is the one that should be streaming.

// --- Exercise 6 (once you've read CONTRIBUTING.md) ---
// Take the `Waypoint` message from Exercise 3. Add a new field to it the
// *right* way (add-only, fresh number). Then, as a deliberate exercise in
// what NOT to do, write a commented-out second version of the field that
// reuses an existing field number with a different type — leave a comment
// explaining what would silently go wrong for a consumer still on the old
// version if this ever shipped for real.

// RIGHT WAY: extend Waypoint with a fresh field number. Nothing about the
// existing wire layout changes — old binaries that don't know about
// `arrival_priority` simply skip the bytes for a field number they don't
// recognize; proto3 was built for exactly this forward-compatible read.
message WaypointV2 {
    rhydon.common.v1.Coordinate position = 1;
    string label = 2;
    Priority arrival_priority = 3;
}

// WRONG WAY (commented out on purpose — this must never actually ship):
//
//   message WaypointV2 {
//     rhydon.common.v1.Coordinate position = 1;
//     string label = 2;
//     int64 arrival_priority = 2;   // <-- reused field number 2!
//   }
//
// Field 2 was `string label` in every already-deployed consumer. Protobuf's
// wire format encodes each field as (field_number, wire_type, value) — it
// does NOT re-verify that the field's type matches what the writer meant.
// A consumer still running the OLD generated code, receiving a message from
// a NEW binary that wrote field 2 as an int64, will try to decode those
// bytes as a string. Depending on the value this either produces garbled
// text, or worse — a value that happens to decode into something that LOOKS
// like a plausible label and gets used downstream with nobody noticing
// until much later. No crash, no compile error, no obvious signal: just
// silently wrong data flowing through the system. This is precisely what
// `buf breaking` in CI exists to catch before it's ever tagged and
// consumed.
