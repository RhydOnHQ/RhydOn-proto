name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `buf breaking` can diff against main.
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1

      - name: Lint
        run: buf lint

      - name: Format check
        run: buf format --diff --exit-code

      # The gate. A renumbered field or changed type fails here rather
      # than in a consumer service three weeks from now.
      - name: Breaking change detection
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${GITHUB_REPOSITORY}.git#branch=main"

      - name: Generate
        run: buf generate

      # Generated code is committed. If regeneration produces a diff,
      # someone edited a .proto without running `make generate`.
      - name: Verify generated code is current
        run: |
          if [ -n "$(git status --porcelain gen/)" ]; then
            echo "::error::gen/ is stale — run 'make generate' and commit."
            git diff --stat gen/
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: go build ./...
